<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Hàng Hóa Vùng Miền Đông</title>
<meta name="theme-color" content="#1e6fd9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hàng Hóa MĐ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html,body{margin:0;height:100%;background:#eaf2fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #cho{position:fixed;inset:0;display:grid;place-items:center;color:#13233f;text-align:center}
  #cho img{width:84px;height:84px;border-radius:22px;margin-bottom:12px}
  #ov{position:fixed;inset:0;background:rgba(19,35,63,.5);display:none;align-items:flex-end;justify-content:center;z-index:9;padding:16px}
  #ov.on{display:flex}
  #ov .bx{background:#fff;border-radius:22px;padding:20px;max-width:420px;width:100%;color:#13233f;font-size:15px;line-height:1.55;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  #ov h3{margin:0 0 8px;font-size:18px}
  #ov ol{margin:6px 0 14px;padding-left:20px}
  #ov button{border:0;border-radius:999px;padding:11px 20px;font-weight:700;background:#13233f;color:#fff;width:100%;font-size:15px}
</style>
</head>
<body>
<div id="cho"><div><img src="icon-192.png" alt=""><div>Đang mở Team Hàng Hóa · Vùng Miền Đông…</div></div></div>
<iframe id="app" title="Team Hàng Hóa Vùng Miền Đông" allow="clipboard-read; clipboard-write; fullscreen" ></iframe>
<div id="ov"><div class="bx" id="ovBox"></div></div>
<script>
/* ===== DÁN LINK WEB APP APPS SCRIPT (đuôi /exec) VÀO ĐÂY ===== */
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbzUOxvxxvsDZbTrilVUVPrm-Na1rq6ZjeWftdF_SI2MdEgwzayY2D2YWkmmTRYAEWRG/exec';

var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
var f = document.getElementById('app');
f.onload = function(){ document.getElementById('cho').style.display = 'none'; };
f.src = EXEC_URL + (EXEC_URL.indexOf('?') < 0 ? '?' : '&') + 'app=' + (standalone ? 'pwa' : 'web');

/* Cài app: Android / máy tính dùng hộp cài của Chrome, iPhone hướng dẫn "Thêm vào MH chính" */
var hoiCai = null;
addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); hoiCai = e; });
addEventListener('appinstalled', function(){ hoiCai = null; });
function moHD(html){ document.getElementById('ovBox').innerHTML = html + '<button type="button" onclick="document.getElementById(\'ov\').classList.remove(\'on\')">Đã hiểu</button>'; document.getElementById('ov').classList.add('on'); }
function caiApp(){
  if (standalone) { moHD('<h3>✅ App đã được cài</h3>Bạn đang mở Team Hàng Hóa từ màn hình chính rồi.'); return; }
  if (hoiCai) { hoiCai.prompt(); hoiCai.userChoice.then(function(){ hoiCai = null; }); return; }
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) moHD('<h3>📲 Cài app trên iPhone / iPad</h3><ol><li>Mở link này bằng <b>Safari</b>.</li><li>Bấm nút <b>Chia sẻ</b> (ô vuông có mũi tên lên).</li><li>Chọn <b>Thêm vào MH chính</b> → <b>Thêm</b>.</li></ol>');
  else moHD('<h3>📲 Cài app</h3><ol><li>Mở link này bằng <b>Chrome</b>.</li><li>Bấm menu <b>⋮</b> góc phải trên.</li><li>Chọn <b>Cài đặt ứng dụng</b> (hoặc <b>Thêm vào màn hình chính</b>).</li></ol>');
}
/* Nút "📲 Cài app lên điện thoại" bên trong Web App gửi tin nhắn ra đây */
addEventListener('message', function(e){ if (e.data && e.data.hhmd === 'caiApp') caiApp(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
